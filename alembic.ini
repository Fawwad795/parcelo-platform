# Alembic configuration.
#
# The database URL is NOT set here. migrations/env.py reads DATABASE_URL from
# the environment (through app.config), so the same command works everywhere:
#
#   alembic upgrade head        # apply all migrations
#   alembic current             # show the revision the database is on
#   alembic downgrade -1        # undo the most recent migration
#
# Migrations change shared state. Deciding WHEN they run during a deploy
# (before the new pods start, exactly once, not once per replica) is one of
# your Week 2 tasks.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
