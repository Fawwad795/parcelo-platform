# Diagnostic (ready to use, not a skeleton): show the identity that AWS will
# see when a job in THIS repository asks for credentials.
#
# Copy to .github/workflows/oidc-debug.yml at task 3.6, run it once from the
# Actions tab, copy the `sub` value into your trust policies, then delete the
# file. It is a measuring instrument, not part of the delivery pipeline.
#
# Why this exists
# ---------------
# An IAM role's trust policy must match the token's `sub` (subject) claim
# EXACTLY. Repositories created after 15 July 2026 present a subject that
# contains numeric ids:
#
#   repo:OWNER@OWNER_ID/REPO@REPO_ID:ref:refs/heads/main
#
# while nearly every tutorial shows the older form:
#
#   repo:OWNER/REPO:ref:refs/heads/main
#
# With the wrong form AWS answers only "Not authorized to perform
# sts:AssumeRoleWithWebIdentity". Guessing costs hours. Printing costs one
# minute. Print it.
#
# What it prints, and why that is safe
# ------------------------------------
# Only a handful of claims from the token's payload: names and numeric ids
# that are already public for a public repository. The token itself is
# masked and never printed. The job has no access to your code (it does not
# check it out) and no permission except asking for an identity token.
#
# How to read the result
# ----------------------
# This run was started by hand on a branch, so its subject ends in
# `:ref:refs/heads/<branch>`. Everything BEFORE that ending is your prefix.
# The three subjects your roles need are that prefix followed by:
#
#   :pull_request               a job in a pull request run (plan role)
#   :environment:infra          a job that declares `environment: infra` (apply role)
#   :environment:production     a job that declares `environment: production` (deploy role)
#
# Cross-check the prefix with:
#   gh api repos/OWNER/REPO/actions/oidc/customization/sub

name: oidc-debug

on:
  workflow_dispatch:

permissions: {}

jobs:
  show-claims:
    name: Print OIDC claims
    runs-on: ubuntu-24.04
    permissions:
      # Lets the job REQUEST an identity token. It grants no write access to
      # anything in the repository.
      id-token: write
    steps:
      - name: Request a token for AWS and print selected claims
        run: |
          set -euo pipefail

          # GitHub injects these two variables only when the job has
          # `id-token: write`. The audience must be the one AWS expects.
          response="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(jq -r '.value' <<<"${response}")"

          # Belt and braces: if anything below ever echoed the token, the
          # runner would replace it with ***.
          echo "::add-mask::${token}"

          # A JWT is header.payload.signature, each part base64url encoded.
          # Convert the payload to ordinary base64 and restore its padding.
          payload="$(cut -d '.' -f 2 <<<"${token}" | tr '_-' '/+')"
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac

          echo "Claims AWS will evaluate for this run:"
          base64 -d <<<"${payload}" | jq '{
            sub, aud,
            repository, repository_id,
            repository_owner, repository_owner_id,
            ref, event_name, environment
          }'
