# Week 3 skeleton: plan infrastructure changes on pull requests, apply on merge.
#
# Copy to .github/workflows/terraform.yml at task 3.7.
#
# What this pipeline is for
# -------------------------
# Parcelo's server was built by hand in the console and nobody can rebuild
# it. From now on, infrastructure changes the same way code does: a pull
# request shows the plan, a human approves, the merge applies it. Nobody runs
# `terraform apply` from a laptop against the `infra` stack again.
#
# How it authenticates
# --------------------
# With OIDC, not with stored keys. GitHub gives the job a short-lived signed
# token that says which repository, branch and environment it is running for.
# AWS checks that token against the trust policy of an IAM role and hands
# back temporary credentials that expire within the hour. There is no
# AWS_ACCESS_KEY_ID secret to leak, rotate or forget.
#
# Read this before you write the trust policy (it is the number one blocker):
#   Repositories created after 15 July 2026 use the IMMUTABLE subject format,
#     repo:OWNER@OWNER_ID/REPO@REPO_ID:ref:refs/heads/main
#   not the older repo:OWNER/REPO:ref:refs/heads/main that most tutorials
#   show. With the old format in your trust policy, AssumeRoleWithWebIdentity
#   is denied and the error does not say why. Print your real prefix with:
#     gh api repos/OWNER/REPO/actions/oidc/customization/sub
#
# Two roles, on purpose
# ---------------------
#   plan role   read-only; trusted for pull requests
#   apply role  can change infrastructure; trusted ONLY for the `infra`
#               environment, which requires your approval
# A pull request must never be able to obtain credentials that can change
# anything.

name: terraform

on:
  # TODO(3.7): plan on pull requests that touch terraform/infra/** or this
  # file; apply on pushes to main that touch the same paths.
  #
  # TODO(3.9): keep the manual trigger below and give it an input that
  # chooses between `apply` and `destroy`. You tear the instance down at the
  # end of every session (assignment/cost-safety.md), so destroying must be as easy
  # and as safe as applying: same `infra` environment, same approval, same
  # apply role. Rebuilding is then "run the workflow with apply".
  workflow_dispatch:

permissions: {}

# TODO(3.7): add a concurrency group so two runs can never apply at the same
# time. For apply, queue instead of cancelling: cancelling a half-finished
# apply is how state gets corrupted.

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: validate and plan (pull requests)
  #
  # Must achieve:
  #   - install the pinned Terraform version (it is not on the runner image)
  #   - `terraform fmt -check -recursive`, `terraform init`, `terraform validate`
  #   - assume the read-only plan role with OIDC
  #   - `terraform plan` saved to a plan file, with the human-readable plan
  #     in the job summary or as a pull request comment
  #
  # SHOULD (TODO 3.8): tflint, and a misconfiguration scan of the Terraform
  # code that fails on HIGH findings.
  #
  # Permissions needed: `id-token: write` (to request the OIDC token; it
  # grants no write access to the repository), `contents: read`, and
  # `pull-requests: write` only if you post a comment.
  #
  # Done when: a pull request that changes an instance type shows exactly
  # that change in the plan, and a pull request with unformatted Terraform
  # fails.
  # ---------------------------------------------------------------------------
  plan:
    name: Validate and plan
    runs-on: ubuntu-24.04
    steps:
      - name: Placeholder (replace with real steps)
        run: |
          echo "terraform.yml is still the starter-kit skeleton: the plan job has no real steps."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 2: apply (pushes to main, behind an approval)
  #
  # Must achieve:
  #   - run only for pushes to main
  #   - use the `infra` environment, which has you as a required reviewer
  #   - assume the apply role with OIDC (its trust policy matches the
  #     ENVIRONMENT subject, not a branch)
  #   - apply, then print the outputs you need next (instance id, public IP)
  #
  # Think about: this job plans again at apply time. What could differ from
  # the plan you reviewed in the pull request, and how would you close that
  # gap? Write your answer in docs/infrastructure.md.
  #
  # Done when: merging a reviewed pull request changes the real
  # infrastructure after you click Approve, and nothing changes if you do
  # not.
  # ---------------------------------------------------------------------------
  apply:
    name: Apply
    runs-on: ubuntu-24.04
    needs: plan
    steps:
      - name: Placeholder (replace with real steps)
        run: |
          echo "terraform.yml is still the starter-kit skeleton: the apply job has no real steps."
          exit 1
